<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ego Episode Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Ego Episode Viewer</h1>
    <select id="dataset" aria-label="Dataset"></select>
    <select id="group" aria-label="Video or task"></select>
    <button id="prev" title="Previous episode (p)">&lt;</button>
    <select id="episode" aria-label="Episode"></select>
    <button id="next" title="Next episode (n)">&gt;</button>
    <span class="hint" id="episode-pos"></span>
    <label><input type="checkbox" id="show-gaze" checked> Gaze</label>
    <label><input type="checkbox" id="show-trail" checked> Trail</label>
    <label><input type="checkbox" id="show-boxes" checked> Boxes</label>
    <span class="hint">Space play/pause · ←/→ 5 s · , / . one frame · n / p episode</span>
  </header>
  <main>
    <section class="left">
      <div class="stage">
        <video id="video" preload="auto" controls muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="views" id="views"></div>
      <div class="timeline-wrap">
        <div class="timeline-label">Steps</div>
        <canvas id="timeline" height="28"></canvas>
        <div id="actions-row">
          <div class="timeline-label">Actions</div>
          <canvas id="actions" height="14"></canvas>
        </div>
        <div id="tracks"></div>
      </div>
    </section>
    <section class="right">
      <div class="card" id="subgoal">
        <div class="eyebrow" id="sg-kind">Current step</div>
        <div class="sg-title" id="sg-title">-</div>
        <div class="sg-group" id="sg-group"></div>
        <div class="sg-row"><span class="k">Current</span><span id="sg-current">-</span></div>
        <div class="sg-row"><span class="k">Action</span><span><span id="sg-action">-</span><span class="detail" id="sg-action-detail"></span></span></div>
        <div class="sg-row"><span class="k">Progress</span><span id="sg-progress">-</span></div>
        <div id="now"></div>
      </div>
      <div class="card graph-card">
        <div class="graph-head">
          <span class="eyebrow" id="graph-title">Task graph</span>
          <span class="legend">
            <i class="sw done"></i>done <i class="sw active"></i>active <i class="sw prep"></i>preparing
            <i class="sw todo"></i>not started
          </span>
        </div>
        <div class="graph-source" id="graph-source"></div>
        <div id="graph"></div>
      </div>
      <div class="card" id="info-card" hidden>
        <div class="eyebrow">About this recording</div>
        <div id="info"></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
